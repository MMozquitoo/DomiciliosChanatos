[project]
name = "chanatos-whatsapp-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "anthropic>=0.122.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.2.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "pyyaml>=6.0.3",
    "aiosqlite>=0.22.0",
    "asyncpg>=0.31.0",
    "python-multipart>=0.0.20",
]

[tool.vercel]
entrypoint = "agent.main:app"
